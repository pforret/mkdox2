name: Shellcheck CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"

    steps:
    - uses: actions/checkout@v4

    - name: Install shellcheck if missing
      # preinstalled on GitHub's ubuntu-latest; needed for local runs with `act`
      run: command -v shellcheck || (sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck)

    - name: Check for code quality errors
      run: ls ./*.sh | xargs shellcheck
