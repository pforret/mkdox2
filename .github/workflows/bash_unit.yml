name: bash_unit CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"

    steps:
    - uses: actions/checkout@v4

    - name: Check for basic execution
      run: ls ./*.sh | xargs bash

    - name: Unit testing with bash_unit
      # run from tests/, like tests/run_tests.sh: test_basic.sh finds the script via `cd ..`
      run: |
        curl -sSL https://raw.githubusercontent.com/pgrange/bash_unit/master/bash_unit -o tests/bash_unit
        chmod +x tests/bash_unit
        cd tests && ./bash_unit test_*
