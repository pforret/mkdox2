# generated by pforret/mkdox v{MKDOX_VERSION}

[project]
site_name = "{SITE_NAME}"
site_url = "https://{SITE_URL}/"
site_description = "{SITE_NAME} — engineering documentation by {USERNAME}"
copyright = "&copy; {CREATION_YEAR} {SITE_NAME} &bull; {USERNAME} &bull; built with mkdox v{MKDOX_VERSION}"

[project.theme]
name = "material"
custom_dir = "docs/overrides"
logo = "icon/android-chrome-192x192.png"
favicon = "icon/android-chrome-192x192.png"
features = [
  "announce.dismiss",
  "content.action.copy",
  "content.code.copy",
  "content.code.annotate",
  "header.autohide",
  "navigation.instant",
  "navigation.integrate",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.integrate",
]

[[project.theme.palette]]
primary = "blue"
accent = "lime"

[project.theme.font]
text = "Source Sans 3"
code = "Source Code Pro"

[project.markdown.extensions]
admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown.extensions.toc]
permalink = true

[project.markdown.extensions."pymdownx.caret"]
[project.markdown.extensions."pymdownx.critic"]
[project.markdown.extensions."pymdownx.details"]
[project.markdown.extensions."pymdownx.keys"]
[project.markdown.extensions."pymdownx.mark"]
[project.markdown.extensions."pymdownx.snippets"]
[project.markdown.extensions."pymdownx.tilde"]

[project.markdown.extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown.extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown.extensions."pymdownx.emoji"]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.markdown.extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.search]

# llms.txt index + Markdown copies of the pages listed below (for AI readers)
[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Overview" = ["index.md", "changelog.md"]
"Getting started" = ["getting-started/*.md"]
"Architecture" = ["architecture/*.md"]
"Contributing" = ["contributing/*.md"]
"Operations" = ["operations/*.md"]
"Reference" = ["reference/*.md"]

# tags in page front matter; listed on docs/tags.md (<!-- material/tags -->)
[project.plugins.tags]

# click to enlarge images
[project.plugins.glightbox]

# self-host Google Fonts and the lightbox assets (downloaded at first build, cached in .cache/)
# other external assets (mermaid, video player, ...) stay remote: add patterns here to self-host them too
[project.plugins.privacy]
assets_include = ["fonts.googleapis.com/*", "fonts.gstatic.com/*", "unpkg.com/glightbox@*"]

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

# social cards + Open Graph tags (uses site_url)
[project.plugins.social]

# Obsidian-style callouts: > [!NOTE]
[project.plugins.callouts]

[project.extra]
generator = false
